# CI del kit-app — corre en cada PR y en push a main.
# Gates: typecheck, lint, tests+cobertura, build, audit de deps, e2e, Lighthouse vs perf-budget.json
name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Tercera red de secretos (auditoría de cierre H1): los hooks locales
      # dependen de core.hooksPath por máquina; CI escanea el working tree
      # siempre. Versión pineada = la validada localmente. S6 (AU-S6-34): el binario se
      # verifica contra su sha256 FIJADO aquí (cotejado el 2026-10-04 con el
      # gitleaks_8.30.1_checksums.txt del release) antes de ejecutarlo, y se baja fuera
      # del árbol que escanea.
      - name: gitleaks (escaneo de secretos del working tree)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" dir . --no-banner --redact
      - uses: pnpm/action-setup@v6
        with: { version: 11 }   # el scaffold estampa pnpm 11 (lockfile + allowBuilds); pnpm 11 exige Node >=22.13
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check     # único gate que ve un peer insatisfecho (kit v1.24.0, regla 18)
      - name: Regla 18 — ningún paquete por debajo de main (kit v1.32.0)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=1
          node scripts/verificar-dependencias.mjs origin/main
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test            # vitest run --coverage (umbral 70% en vitest.config)
      - run: pnpm build
      # S5: peso del runtime Pyodide que descarga el navegador (núcleo + cierre de wheels) contra
      # pyodide-budget.json — la DoD «crece ≤ 2 MB» medida en cada PR, no a mano (nació en rojo).
      - run: node scripts/verificar-peso-pyodide.mjs
      - run: pnpm audit --audit-level high

  integration:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Pipeline anti-fuga en Pyodide/WASM (fit-solo-en-train). Descarga las
      # wheels de pandas/scikit-learn del CDN de Pyodide en la primera corrida.
      - run: pnpm test:integration

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11 }   # el scaffold estampa pnpm 11 (lockfile + allowBuilds); pnpm 11 exige Node >=22.13
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e        # incluye scans axe (@axe-core/playwright); falla con CERO pruebas (kit v1.28.0)
      # El primer reintento graba trace (playwright.config `trace: on-first-retry`) con
      # consola, errores y DOM — se sube SOLO cuando algo falla (kit v1.26.0).
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  lighthouse:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11 }   # el scaffold estampa pnpm 11 (lockfile + allowBuilds); pnpm 11 exige Node >=22.13
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lighthouse CI contra perf-budget.json (URLs de lighthouse-urls.json)
        # Cada sprint añade sus rutas nuevas a lighthouse-urls.json (default: ["/"]).
        # Nota Lantern: el LCP SIMULADO sobre localhost castiga SPAs sanas (nutri-kids S1:
        # 3.8s simulado vs 242ms observado) — budgets client-side necesitan margen documentado.
        #
        # ds S4 (2026-08-15, PRIMERA ejecución real de este job: llevaba meses `skipped`
        # porque `quality` estaba en rojo por `pnpm audit`). LCP simulado 3086-3142 ms en
        # runner vs 2611-2763 ms en local, con budget de 3000 ⇒ rojo por un 3%. Diagnóstico
        # con el desglose por fases: TTFB 452 · Load Delay 0 · Load Time 0 · **Render Delay
        # 2310** (84%) sobre un elemento LCP que es un PÁRRAFO DE TEXTO ya presente en el
        # HTML pre-renderizado (verificado en .next/server/app/index.html). Todo lo
        # OBSERVABLE está sano: respuesta del servidor 2 ms, TBT 2-6 ms, font-display OK,
        # CSS con 0 ms de ahorro, y los budgets de PESO (script 300 KB / total 1 MB) pasan.
        # El budget sube a 3500 ms como margen documentado: sigue atrapando lo que este gate
        # existe para atrapar (que Pyodide entre al camino del LCP sería un salto de varios
        # segundos, no de un 15%). Deuda H2: medir el LCP OBSERVADO con PerformanceObserver
        # en un e2e, que es lo que de verdad experimenta el usuario.
        #
        # S5 (kit v1.26.0): UNA corrida NO es una medición — tres corridas por URL y se asevera
        # sobre la MEDIANA (median-run), nunca sobre la optimista.
        run: |
          # S6 (AU-S6-34): versión fijada; un LHCI nuevo con otros flags no cambia el gate en silencio.
          npm i -g @lhci/cli@0.15.1
          URLS=$(node -e "console.log(require('./lighthouse-urls.json').map(u=>'--url=http://localhost:3000'+u).join(' '))")
          lhci collect --startServerCommand="pnpm start" --numberOfRuns=3 $URLS
          lhci assert --budgetsFile=./perf-budget.json --aggregationMethod=median-run
      # S6 (deuda del S5, kit v1.12.0): las 4 CATEGORÍAS ≥ 0.9 sobre la MISMA colección. Va en un
      # segundo `lhci assert` porque LHCI declara budgetsFile y assertions mutuamente excluyentes;
      # el job no cambia de nombre (no toca la ruleset). Nació en rojo con scripts/demo-rojo.sh.
      - name: Lighthouse CI — categorías ≥ 0.9 (lighthouse-categorias.json)
        run: lhci assert --config=./lighthouse-categorias.json --aggregationMethod=median-run
