<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Puntuador portátil · Probeta DS</title>
<style>
:root{--bg:#fafaf7;--surface:#fff;--ink:#1c1d1a;--muted:#5a5c55;--line:#d9dad3;--accent:#1d4f91;--accent-ink:#fff;--caution:#8a4b00;--bad:#9c1c1c}
@media (prefers-color-scheme:dark){:root{--bg:#161715;--surface:#1f201d;--ink:#ecece6;--muted:#a9aba2;--line:#3a3b36;--accent:#8fb8ee;--accent-ink:#10161f;--caution:#f0b25c;--bad:#ff9a9a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:46rem;margin:0 auto;padding:1.5rem 1rem 3rem;display:flex;flex-direction:column;gap:1rem}
h1{font-size:1.4rem;margin:0}
h2{font-size:1rem;margin:0 0 .25rem}
p{margin:.25rem 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:.5rem;padding:1rem}
.muted{color:var(--muted);font-size:.875rem}
.caution{color:var(--caution)}
.bad{color:var(--bad)}
label.zona{display:flex;flex-direction:column;gap:.5rem;align-items:flex-start;border:2px dashed var(--line);border-radius:.5rem;padding:1rem;min-height:5rem;cursor:pointer}
label.zona.arrastre{border-color:var(--accent)}
input[type=file]{max-width:100%}
button{min-height:2.75rem;padding:0 1rem;border-radius:.375rem;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
button{display:inline-flex;align-items:center;gap:.5rem}
button svg{width:1.25rem;height:1.25rem;flex:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
table{width:100%;border-collapse:collapse;font-size:.875rem}
th,td{text-align:left;padding:.35rem .5rem;border-top:1px solid var(--line)}
th{font-weight:600;color:var(--muted);border-top:0}
td.num{font-variant-numeric:tabular-nums}
.tabla{overflow-x:auto}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="titulo"></h1>
    <p id="intro" class="muted"></p>
  </header>
  <section class="card" aria-labelledby="aviso-t">
    <h2 id="aviso-t"></h2>
    <p id="aviso" class="muted"></p>
  </section>
  <div id="estado" class="card" role="status" aria-live="polite"></div>
  <section id="paso" class="card" hidden aria-labelledby="paso-t">
    <h2 id="paso-t"></h2>
    <label class="zona" id="zona"><span id="zona-t"></span><input type="file" id="archivo" accept=".csv,text/csv"></label>
  </section>
  <section id="resultado" class="card" hidden aria-labelledby="res-t">
    <h2 id="res-t"></h2>
    <p id="res-resumen"></p>
    <p id="res-novedad" class="muted"></p>
    <div class="tabla"><table><caption id="res-cap" class="muted" style="text-align:left"></caption><thead id="res-head"></thead><tbody id="res-body"></tbody></table></div>
    <p><button type="button" id="descargar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14"/></svg><span id="descargar-t"></span></button></p>
  </section>
</main>
<script type="application/json" id="modelo">__MODELO_JSON__</script>
<script type="text/plain" id="puntuar-py">__PUNTUAR_PY__</script>
<script>
"use strict";
// Puntuador portátil de Probeta DS. Un solo archivo: el modelo va adentro; el motor (Pyodide con pandas y scikit-learn,
// en las versiones del modelo) se baja del CDN público de Pyodide. Lo que arrastras NO sale de tu navegador.
var PYODIDE = "314.0.2";
var INDEX = "https://cdn.jsdelivr.net/pyodide/v" + PYODIDE + "/full/";
// S21: el motor se carga con SRI. Es el hash del `pyodide.js` de ESA versión; `verificar-publica` lo cruza con el CDN y una prueba con el
// paquete fijado, así que subir PYODIDE sin cambiar esto rompe la CI en lugar de dejar el puntuador sin integridad.
var PYODIDE_SRI = "sha384-Y0xVpf8xnYY2wjyRPIe9ZRoE61jRI5ihohgCmZlml2k7pWtPdL7ebjaNml0Esgzg";
var MAX_BYTES = 5 * 1024 * 1024, MAX_FILAS = 50000;
var TXT = {
  es: {
    titulo: "Puntuador portátil", intro: "Puntúa un CSV con el modelo «{m}» sin subir nada a ningún servidor: corre en tu navegador.",
    avisoT: "Qué lleva este archivo", aviso: "Lleva el modelo entrenado y su manifiesto: los rangos y las categorías que vio al entrenar, el nombre del conjunto de datos y las métricas de su prueba. Un modelo de vecinos más cercanos lleva además filas del entrenamiento. Compártelo solo con quien puedas darle eso. Necesita internet la primera vez (descarga el motor, unos 35 MB, del CDN público de Pyodide); tus filas no salen de este navegador.",
    cargando: "Preparando el motor (Pyodide, pandas, scikit-learn)…", listo: "✓ Listo. El modelo «{m}» ({t}) espera un CSV con las columnas: {c}.",
    pasoT: "1. Elige tu CSV", zona: "Arrastra aquí un CSV o pulsa para elegirlo (hasta 5 MB y 50 000 filas)",
    puntuando: "Puntuando…", resT: "2. Resultado", filas: "{n} filas puntuadas.", sinNovedad: "Sin novedad: ningún valor fuera de lo que el modelo vio al entrenar.",
    novedad: "⚠ Novedad: {a} de {n} filas traen valores que el modelo nunca vio ({c}). Sus puntajes son menos fiables.",
    cap: "Primeras {k} filas", fila: "Fila", pred: "Predicción", prob: "Probabilidad", grupo: "Grupo", sinProb: "—", descargar: "Descargar el CSV puntuado",
    positiva: "La probabilidad es la de la clase «{p}».", fuera: "Grupo −1 = fuera de todo grupo.",
    eManifiesto: "✕ Este archivo no es un modelo de Probeta DS de este formato.", eHash: "✕ El SHA-256 del modelo no coincide con el del manifiesto: el archivo cambió y no se abre.",
    eVersion: "✕ Este modelo se entrenó con Pyodide {v}; este puntuador usa {p}. No se abre para no puntuar distinto sin avisar.",
    eMotor: "✕ No se pudo preparar el motor (¿sin internet?). Vuelve a abrir esta página con conexión.", eCsv: "✕ No se pudo leer el CSV: {x}",
    eVacio: "el archivo no tiene filas", eGrande: "pasa de 5 MB", eFilas: "pasa de 50 000 filas", eRagged: "la fila {r} tiene {f} columnas y se esperaban {e}",
    eFaltan: "faltan las columnas: {c}", ePuntua: "✕ El modelo no pudo puntuar este CSV ({t})."
  },
  en: {
    titulo: "Portable scorer", intro: "Scores a CSV with the model “{m}” without uploading anything to a server: it runs in your browser.",
    avisoT: "What this file carries", aviso: "It carries the trained model and its manifest: the ranges and categories it saw in training, the name of the dataset and the metrics of its test. A nearest-neighbours model also carries training rows. Share it only with someone you can give that to. It needs internet the first time (it downloads the engine, about 35 MB, from the public Pyodide CDN); your rows never leave this browser.",
    cargando: "Preparing the engine (Pyodide, pandas, scikit-learn)…", listo: "✓ Ready. The model “{m}” ({t}) expects a CSV with these columns: {c}.",
    pasoT: "1. Choose your CSV", zona: "Drop a CSV here or press to choose one (up to 5 MB and 50,000 rows)",
    puntuando: "Scoring…", resT: "2. Result", filas: "{n} rows scored.", sinNovedad: "Nothing new: no value outside what the model saw in training.",
    novedad: "⚠ Novelty: {a} of {n} rows carry values the model never saw ({c}). Their scores are less reliable.",
    cap: "First {k} rows", fila: "Row", pred: "Prediction", prob: "Probability", grupo: "Group", sinProb: "—", descargar: "Download the scored CSV",
    positiva: "The probability is that of the class “{p}”.", fuera: "Group −1 = outside every group.",
    eManifiesto: "✕ This file is not a Probeta DS model of this format.", eHash: "✕ The model's SHA-256 does not match the manifest's: the file changed and will not open.",
    eVersion: "✕ This model was trained with Pyodide {v}; this scorer uses {p}. It will not open so as not to score differently without saying so.",
    eMotor: "✕ The engine could not be prepared (offline?). Open this page again with a connection.", eCsv: "✕ The CSV could not be read: {x}",
    eVacio: "the file has no rows", eGrande: "it is over 5 MB", eFilas: "it is over 50,000 rows", eRagged: "row {r} has {f} columns and {e} were expected",
    eFaltan: "missing columns: {c}", ePuntua: "✕ The model could not score this CSV ({t})."
  }
};
var lang = /^en/i.test(navigator.language || "") ? "en" : "es";
function t(k, p) { var s = TXT[lang][k]; for (var n in (p || {})) s = s.split("{" + n + "}").join(String(p[n])); return s; }
var $ = function (id) { return document.getElementById(id); };
function estado(msg, clase) { var e = $("estado"); e.textContent = msg; e.className = "card" + (clase ? " " + clase : ""); }

var ARCHIVO = JSON.parse($("modelo").textContent), M = ARCHIVO.manifest || {};
var SCHEMA = M.schema || {}, COLS = (SCHEMA.numeric || []).concat(SCHEMA.categorical || []);
var NOMBRE = M.model_name || "modelo", TAREA = SCHEMA.task || "binaria";
var py = null, listo = false, ultimo = null;

function bytesDeB64(b64) { var bin = atob(b64), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ("0" + b.toString(16)).slice(-2); }).join(""); }

// Lo mismo que hace la app antes de abrir un modelo: el formato, el SHA-256 y la versión del motor, ANTES de deserializar nada.
async function validar() {
  if (ARCHIVO.format_version !== 1 || M.payload_encoding !== "pickle+zlib+base64" || typeof ARCHIVO.payload !== "string" || !COLS.length) throw t("eManifiesto");
  var digest = await crypto.subtle.digest("SHA-256", bytesDeB64(ARCHIVO.payload));
  if (hex(digest) !== M.payload_sha256) throw t("eHash");
  var v = (M.versions || {}).pyodide;
  if (v !== PYODIDE) throw t("eVersion", { v: v, p: PYODIDE });
}

function cargarScript(src, sri) {
  return new Promise(function (ok, no) {
    var s = document.createElement("script"); s.src = src;
    if (sri) { s.integrity = sri; s.crossOrigin = "anonymous"; }
    s.onload = ok; s.onerror = no; document.head.appendChild(s);
  });
}

async function prepararMotor() {
  await cargarScript(INDEX + "pyodide.js", PYODIDE_SRI);
  py = await loadPyodide({ indexURL: INDEX });
  await py.loadPackage(["pandas", "scikit-learn"]);
  if (NOMBRE === "lightgbm") await py.loadPackage("lightgbm");
  if (NOMBRE === "xgboost") {
    var lock = await (await fetch(INDEX + "pyodide-lock.json")).json();
    await py.loadPackage(INDEX + lock.packages.xgboost.file_name);
  }
  py.FS.writeFile("puntuar.py", $("puntuar-py").textContent);
  py.globals.set("PAYLOAD", ARCHIVO.payload);
  py.globals.set("ESQUEMA", JSON.stringify(SCHEMA));
  py.runPython("import json, puntuar\nMODELO = puntuar.load_model(PAYLOAD, json.loads(ESQUEMA))\ndel PAYLOAD");
}

// RFC 4180 mínimo, como el de la app: comillas dobles, comas y saltos de línea dentro de comillas, "" escapa una comilla.
function filasDeCsv(texto) {
  if (texto.charCodeAt(0) === 0xfeff) texto = texto.slice(1);
  var filas = [], fila = [], campo = "", q = false;
  for (var i = 0; i < texto.length; i++) {
    var c = texto[i];
    if (q) { if (c === '"') { if (texto[i + 1] === '"') { campo += '"'; i++; } else q = false; } else campo += c; }
    else if (c === '"') q = true;
    else if (c === ",") { fila.push(campo); campo = ""; }
    else if (c === "\r") { /* lo cierra el \n */ }
    else if (c === "\n") { fila.push(campo); filas.push(fila); fila = []; campo = ""; }
    else campo += c;
  }
  if (campo !== "" || fila.length) { fila.push(campo); filas.push(fila); }
  return filas.filter(function (f) { return !(f.length === 1 && f[0].trim() === ""); });
}

function csvDe(filas) {
  return filas.map(function (f) { return f.map(function (v) { v = String(v == null ? "" : v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(","); }).join("\n") + "\n";
}

async function puntuar(archivo) {
  $("resultado").hidden = true;
  try {
    if (archivo.size > MAX_BYTES) throw t("eGrande");
    var todas = filasDeCsv(await archivo.text());
    if (todas.length < 2) throw t("eVacio");
    var cab = todas[0], filas = todas.slice(1);
    if (filas.length > MAX_FILAS) throw t("eFilas");
    for (var r = 0; r < filas.length; r++) if (filas[r].length !== cab.length) throw t("eRagged", { r: r + 2, f: filas[r].length, e: cab.length });
    var faltan = COLS.filter(function (c) { return cab.indexOf(c) < 0; });
    if (faltan.length) throw t("eFaltan", { c: faltan.join(", ") });
  } catch (e) { estado(t("eCsv", { x: e }), "bad"); return; }
  estado(t("puntuando"));
  try {
    py.globals.set("CABECERA", JSON.stringify(cab));
    py.globals.set("FILAS", JSON.stringify(filas));
    var res = JSON.parse(py.runPython("json.dumps(puntuar.score(MODELO, json.loads(CABECERA), json.loads(FILAS)))"));
    ultimo = { cab: cab, filas: filas, res: res };
    mostrar(ultimo);
    estado(t("listo", { m: NOMBRE, t: TAREA, c: COLS.join(", ") }));
  } catch (e) {
    var tipo = String(e && e.message || e).split("\n").filter(Boolean).pop().split(":")[0];
    estado(t("ePuntua", { t: tipo.slice(0, 60) }), "bad");
  }
}

function mostrar(u) {
  var r = u.res, n = r.novelty.n_rows, k = Math.min(20, n), etiqueta = TAREA === "agrupar" ? t("grupo") : t("pred");
  $("res-resumen").textContent = t("filas", { n: n }) + (r.positive_class ? " " + t("positiva", { p: r.positive_class }) : "") + (TAREA === "agrupar" ? " " + t("fuera") : "");
  $("res-novedad").textContent = r.novelty.affected_rows ? t("novedad", { a: r.novelty.affected_rows, n: n, c: r.novelty.columns.map(function (x) { return x.column; }).join(", ") }) : t("sinNovedad");
  $("res-cap").textContent = t("cap", { k: k });
  var tr = function (cells, tag) { var f = document.createElement("tr"); cells.forEach(function (c, i) { var e = document.createElement(tag === "th" || i === 0 ? "th" : "td"); if (tag === "th") e.scope = "col"; else if (i === 0) e.scope = "row"; else if (i > 1) e.className = "num"; e.textContent = c; f.appendChild(e); }); return f; };
  $("res-head").replaceChildren(tr([t("fila"), etiqueta].concat(r.probabilities ? [t("prob")] : []), "th"));
  var cuerpo = [];
  for (var i = 0; i < k; i++) cuerpo.push(tr([String(i + 1), String(r.predictions[i])].concat(r.probabilities ? [Number(r.probabilities[i]).toFixed(4)] : []), "td"));
  $("res-body").replaceChildren.apply($("res-body"), cuerpo);
  $("resultado").hidden = false;
}

$("descargar").addEventListener("click", function () {
  if (!ultimo) return;
  var r = ultimo.res, cab = ultimo.cab.concat([TAREA === "agrupar" ? "grupo" : "prediccion"]).concat(r.probabilities ? ["probabilidad"] : []);
  var salida = [cab].concat(ultimo.filas.map(function (f, i) { return f.concat([r.predictions[i]]).concat(r.probabilities ? [r.probabilities[i]] : []); }));
  var url = URL.createObjectURL(new Blob([csvDe(salida)], { type: "text/csv" })), a = document.createElement("a");
  a.href = url; a.download = "puntuado-" + NOMBRE + ".csv"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
});
$("archivo").addEventListener("change", function (e) { if (listo && e.target.files[0]) puntuar(e.target.files[0]); });
["dragover", "dragenter"].forEach(function (n) { $("zona").addEventListener(n, function (e) { e.preventDefault(); $("zona").classList.add("arrastre"); }); });
["dragleave", "drop"].forEach(function (n) { $("zona").addEventListener(n, function (e) { e.preventDefault(); $("zona").classList.remove("arrastre"); if (n === "drop" && listo && e.dataTransfer.files[0]) puntuar(e.dataTransfer.files[0]); }); });

document.documentElement.lang = lang;
$("titulo").textContent = t("titulo"); $("intro").textContent = t("intro", { m: NOMBRE });
$("aviso-t").textContent = t("avisoT"); $("aviso").textContent = t("aviso");
$("paso-t").textContent = t("pasoT"); $("zona-t").textContent = t("zona"); $("res-t").textContent = t("resT"); $("descargar-t").textContent = t("descargar");
document.title = t("titulo") + " · " + NOMBRE;
estado(t("cargando"));
validar().then(prepararMotor).then(function () {
  listo = true; $("paso").hidden = false; estado(t("listo", { m: NOMBRE, t: TAREA, c: COLS.join(", ") }));
}).catch(function (e) { estado(typeof e === "string" ? e : t("eMotor"), "bad"); });
</script>
</body>
</html>
